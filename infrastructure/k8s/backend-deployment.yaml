apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: revflow-prod
  labels:
    app: revflow
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revflow
      component: backend
  template:
    metadata:
      labels:
        app: revflow
        component: backend
    spec:
      containers:
        - name: backend
          image: revflow/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: revflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: revflow-secrets
                  key: REDIS_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: revflow-config
                  key: CORS_ORIGINS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: revflow-prod
spec:
  ports:
    - port: 8000
  selector:
    app: revflow
    component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: revflow-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
