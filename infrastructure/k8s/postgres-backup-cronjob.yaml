apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: revflow-prod
spec:
  schedule: "0 2 * * *" # Run at 2 AM every day
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              pg_dump -h postgres -U $POSTGRES_USER $POSTGRES_DB | gzip > /backup/db_backup_$TIMESTAMP.sql.gz
              # In a real scenario, you'd add AWS CLI here to sync to S3
              # aws s3 cp /backup/db_backup_$TIMESTAMP.sql.gz s3://my-backup-bucket/
            env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: revflow-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: revflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: revflow-secrets
                  key: POSTGRES_PASSWORD
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: revflow-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
