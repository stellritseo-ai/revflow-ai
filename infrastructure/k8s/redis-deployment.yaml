apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: revflow-prod
  labels:
    app: revflow
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: revflow
      component: cache
  template:
    metadata:
      labels:
        app: revflow
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: revflow-secrets
                  key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: revflow-prod
spec:
  ports:
    - port: 6379
  selector:
    app: revflow
    component: cache
