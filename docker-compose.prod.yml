version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: revflow_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-revflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    container_name: revflow_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  minio:
    image: minio/minio:latest
    container_name: revflow_prod_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: revflow/backend:latest
    container_name: revflow_prod_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-revflow}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-admin123}
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://app.revflow.com", "https://revflow.com"]}
      - PROJECT_NAME=RevFlow AI
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
      - proxy_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: revflow/frontend:latest
    container_name: revflow_prod_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.revflow.com/api/v1}
    depends_on:
      - backend
    networks:
      - internal_network
      - proxy_network

  nginx:
    image: nginx:alpine
    container_name: revflow_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - proxy_network

  prometheus:
    image: prom/prometheus:latest
    container_name: revflow_prod_prometheus
    restart: always
    volumes:
      - ./infrastructure/observability/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal_network

  grafana:
    image: grafana/grafana:latest
    container_name: revflow_prod_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data_prod:/var/lib/grafana
    networks:
      - internal_network

  loki:
    image: grafana/loki:latest
    container_name: revflow_prod_loki
    restart: always
    ports:
      - "3100:3100"
    networks:
      - internal_network

volumes:
  pgdata_prod:
  minio_data_prod:
  prometheus_data_prod:
  grafana_data_prod:

networks:
  internal_network:
    driver: bridge
  proxy_network:
    driver: bridge
